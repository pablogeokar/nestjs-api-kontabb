allowBuilds:
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  libxmljs2: true
  unrs-resolver: false
  xsd-schema-validator: false

# Overrides de seguranca: forcam versoes corrigidas de dependencias transitivas
# vulneraveis (ver .agents/tasks/security-fix-deps-2026-10-11.md).
